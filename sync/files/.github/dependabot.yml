# Majors are ignored here and handled deliberately via rust-base.
# rust-base's own Dependabot (weekly, majors visible) is the canary.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    labels: ["release:patch", "dependencies"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: ["release:patch", "dependencies"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
