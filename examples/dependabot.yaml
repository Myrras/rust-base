# Copy to .github/dependabot.yml. The `release:patch` label satisfies the release-label
# gate in pr-checks.yml; the changelog gate is skipped for Dependabot PRs.
# (.yaml, not .yml: self-ci runs actionlint on examples/*.yml, workflows only.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["release:patch", "dependencies"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: ["release:patch", "dependencies"]
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["release:patch", "dependencies"]
    groups:
      npm:
        patterns: ["*"]
    # typescript-eslint doesn't support TypeScript 7 yet; remove when it does.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
