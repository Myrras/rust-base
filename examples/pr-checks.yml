# Every PR needs a CHANGELOG entry under `## [Unreleased]` and exactly one of
# the labels `release:patch`, `release:minor` or `release:major` (the version bump on merge). Separate
# from ci.yml so that (un)labelling a PR doesn't re-run the full build.
name: PR checks

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

# No concurrency group: every run must complete. A cancelled run stays on the
# head commit as a cancelled required check and blocks the merge. The jobs read
# the PR's current labels after a short wait (hence pull-requests: read), so
# every run of a burst of label events reaches the same result.
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-checks:
    uses: Myrras/rust-base/.github/workflows/reusable-pr-checks.yml@v2
    # with:
    #   ci-ref: v2
