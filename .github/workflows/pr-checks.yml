# Pull request gates for the release flow in release.yml:
# - changelog: the PR adds an entry under `## [Unreleased]` in CHANGELOG.md
#   (merging to main releases it).
# - release-label: the PR carries exactly one of `patch`, `minor` or `major`;
#   it decides the version bump on merge (scripts/next-version.sh).
#
# The caller triggers on pull_request with the label event types (see
# examples/pr-checks.yml), separate from CI so that labelling a PR doesn't
# re-run the full build.
name: pr-checks

on:
  workflow_call:
    inputs:
      ci-ref:
        description: Ref of RobbieMinderhoud/ci-workflows to fetch the shared scripts from.
        type: string
        default: v1

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changelog:
    name: Changelog entry
    # Skipped for Dependabot PRs. Judged on the PR author, not github.actor,
    # which changes when someone rebases the PR. A deps-only merge has no
    # CHANGELOG entry, so release.yml treats it as "nothing to release"; the
    # bumps ship with the next release.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RobbieMinderhoud/ci-workflows
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false
      - run: mv .ci "$RUNNER_TEMP/ci"

      - name: PR adds a CHANGELOG entry
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git diff --name-only "origin/$BASE_REF...HEAD" | grep -qx CHANGELOG.md \
            || ! bash "$RUNNER_TEMP/ci/scripts/changelog.sh" unreleased >/dev/null; then
            echo "::error file=CHANGELOG.md::Add an entry for this change under '## [Unreleased]' in CHANGELOG.md (Keep a Changelog headings, user-facing voice). Merging to main releases it."
            exit 1
          fi

  release-label:
    name: Release label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    steps:
      - name: Require exactly one release label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          count=$(jq '[.[] | select(. == "patch" or . == "minor" or . == "major")] | length' <<< "$LABELS")
          if [ "$count" -ne 1 ]; then
            echo "::error::Add exactly one release label to this PR: patch, minor or major (found $count)."
            exit 1
          fi
