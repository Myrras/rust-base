# Every PR needs a CHANGELOG entry under `## [Unreleased]` and exactly one of
# the labels `release:patch`, `release:minor`, `release:major` or `no-release`.
# Separate from ci.yml so that (un)labelling a PR doesn't re-run the full build.
# Runs the LOCAL reusable workflow with this repo's files at the PR's head
# commit, so a PR tests its own changes.
name: PR checks

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    uses: ./.github/workflows/reusable-pr-checks.yml
    with:
      ci-repo: ${{ github.repository }}
      ci-ref: ${{ github.event.pull_request.head.sha || github.sha }}
