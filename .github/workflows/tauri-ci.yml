# Reusable CI for the Tauri apps: frontend checks, Rust checks (rust-runner),
# an optional Windows job and a single `ci-ok` job to use as the required check.
# The check recipes live in common.just, fetched from this repo into `.ci`.
name: Tauri CI

on:
  workflow_call:
    inputs:
      ci-ref:
        description: Ref of RobbieMinderhoud/ci-workflows to fetch common.just from.
        type: string
        default: v1
      rust-runner:
        description: Runner for the Rust job. macOS avoids the webkit deps a Linux runner needs.
        type: string
        default: macos-latest
      windows:
        description: Also run the Rust checks on windows-latest.
        type: boolean
        default: true
      windows-test-scope:
        description: Arguments for `cargo test` on Windows (e.g. `-p my-core`).
        type: string
        default: --workspace
      extra-recipe:
        description: Recipe from the caller's justfile to run after the rust recipe, on the rust runner.
        type: string
        default: ""

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch shared CI files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RobbieMinderhoud/ci-workflows
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false

      - name: Move shared CI files out of the workspace
        run: mv .ci "$RUNNER_TEMP/ci"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: just -f "$RUNNER_TEMP/ci/common.just" -d . frontend

  rust:
    runs-on: ${{ inputs.rust-runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch shared CI files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RobbieMinderhoud/ci-workflows
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false

      - name: Move shared CI files out of the workspace
        run: mv .ci "$RUNNER_TEMP/ci"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Tauri's build script links against the system WebKitGTK/GTK libraries.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}

      - name: Rust checks
        run: just -f "$RUNNER_TEMP/ci/common.just" -d . rust

      - name: Extra recipe
        if: inputs.extra-recipe != ''
        env:
          EXTRA_RECIPE: ${{ inputs.extra-recipe }}
        run: just "$EXTRA_RECIPE"

  windows:
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TEST_SCOPE: ${{ inputs.windows-test-scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch shared CI files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RobbieMinderhoud/ci-workflows
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false

      - name: Move shared CI files out of the workspace
        run: mv .ci "$RUNNER_TEMP/ci"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}

      - name: Rust checks
        run: just -f "$RUNNER_TEMP/ci/common.just" -d . rust

  ci-ok:
    if: always()
    needs: [frontend, rust, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # A skipped windows job (windows: false) is fine; failure or cancel is not.
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
