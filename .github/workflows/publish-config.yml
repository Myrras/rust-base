# Publishes packages/config (the shared frontend config) to npm. Runs on a
# `config-vX.Y.Z` tag, or by hand on such a tag:
# `gh workflow run publish-config.yml --ref config-vX.Y.Z`.
# Auth is npm trusted publishing (OIDC), no token: the package's npm settings
# must list this repo and workflow file as its trusted publisher. That can only
# be set once the package exists, so the first publish is a manual
# `npm publish --access public` by the owner.
name: publish-config

on:
  push:
    tags: ["config-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-config-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: packages/config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 24's bundled npm may be older.
      - name: Update npm
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Check the tag matches package.json
        run: |
          if [[ "$GITHUB_REF" != refs/tags/config-v* ]]; then
            echo "::error::Run this on a config-vX.Y.Z tag, not $GITHUB_REF: gh workflow run publish-config.yml --ref config-vX.Y.Z"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#config-v}"
          version="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $name@$version in packages/config/package.json"
            exit 1
          fi
          echo "Publishing $name@$version"

      - name: Publish
        run: npm publish --provenance --access public
