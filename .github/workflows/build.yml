name: Build

# Builds the template app's installers by hand from the Actions tab, to test
# the LOCAL reusable build workflow. rust-base has no release job, so nothing
# dispatches this; in an app, the shared release workflow dispatches build.yml
# by name with `--ref <tag>`, so it must stay named `build.yml`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      ci-repo: ${{ github.repository }}
      ci-ref: ${{ github.sha }}
