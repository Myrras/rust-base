# Reusable CI for the Tauri apps: frontend checks, Rust checks (rust-runner,
# ubuntu-latest by default), a Windows job and a single `ci-ok` job to use as
# the required check.
#
# The defaults keep billed minutes low (Linux 1x, Windows 2x, macOS 10x):
# - Windows (`windows: auto`) runs on every event except pull requests; on a
#   pull request only when it carries the `windows` label. A push to main always
#   runs it, so it still gates the release. The caller re-runs CI when the label
#   is added (`labeled` in examples/ci.yml).
# - The Rust cache is saved only from main; PR runs restore it.
#
# The check recipes live in ci/common.just, fetched from `ci-repo` at `ci-ref`
# (checked out to `.ci`, then moved to `$RUNNER_TEMP/rust-base`).
name: Tauri CI

on:
  workflow_call:
    inputs:
      ci-ref:
        description: Ref of `ci-repo` to fetch `ci/common.just` from.
        type: string
        default: v1
      ci-repo:
        description: Repository holding the shared files (`ci/common.just`, `ci/scripts/`).
        type: string
        default: RobbieMinderhoud/rust-base
      rust-runner:
        description: Runner for the Rust job. On Linux the Tauri system packages are installed first.
        type: string
        default: ubuntu-latest
      windows:
        description: >-
          When to run the Rust checks on windows-latest: `auto` (every event
          except pull requests; pull requests only with the `windows` label),
          `always` or `never`.
        type: string
        default: auto
      windows-test-scope:
        description: Arguments for `cargo test` on Windows (e.g. `-p my-core`).
        type: string
        default: --workspace
      extra-recipe:
        description: Recipe from the caller's justfile to run after the rust recipe, on the rust runner.
        type: string
        default: ""

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch shared CI files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.ci-repo }}
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false

      - name: Move shared CI files out of the workspace
        run: mv .ci "$RUNNER_TEMP/rust-base"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: just -f "$RUNNER_TEMP/rust-base/ci/common.just" -d . frontend

  rust:
    runs-on: ${{ inputs.rust-runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch shared CI files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.ci-repo }}
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false

      - name: Move shared CI files out of the workspace
        run: mv .ci "$RUNNER_TEMP/rust-base"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Tauri's build script links against the system WebKitGTK/GTK libraries;
      # libdbus/pkg-config cover keyring and other D-Bus crates.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Only main saves the cache (PRs restore it), so PR runs don't evict
      # main's entries from the 10 GB repo cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Rust checks
        run: just -f "$RUNNER_TEMP/rust-base/ci/common.just" -d . rust

      - name: Extra recipe
        if: inputs.extra-recipe != ''
        env:
          EXTRA_RECIPE: ${{ inputs.extra-recipe }}
        run: just "$EXTRA_RECIPE"

  windows:
    if: >-
      inputs.windows == 'always'
      || (inputs.windows == 'auto'
          && (github.event_name != 'pull_request'
              || contains(github.event.pull_request.labels.*.name, 'windows')))
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TEST_SCOPE: ${{ inputs.windows-test-scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch shared CI files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.ci-repo }}
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false

      - name: Move shared CI files out of the workspace
        run: mv .ci "$RUNNER_TEMP/rust-base"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Only main saves the cache (PRs restore it), so PR runs don't evict
      # main's entries from the 10 GB repo cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Rust checks
        run: just -f "$RUNNER_TEMP/rust-base/ci/common.just" -d . rust

  ci-ok:
    if: always()
    needs: [frontend, rust, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # A skipped windows job (no `windows` label, or `windows: never`) is
      # fine; failure or cancel is not.
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          case "$WINDOWS" in
            auto | always | never) ;;
            *)
              echo "::error::Input windows must be auto, always or never (got '$WINDOWS')."
              exit 1
              ;;
          esac
          echo "needed job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
