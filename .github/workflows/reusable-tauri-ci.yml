# Reusable CI for the Tauri apps: frontend checks, Rust checks (rust-runner,
# ubuntu-latest by default), a Windows job and a single `ci-ok` job to use as
# the required check.
#
# The defaults keep billed minutes low (Linux 1x, Windows 2x, macOS 10x):
# - Windows (`windows: auto`) runs on every event except pull requests; on a
#   pull request only when it carries the `windows` label. A push to main always
#   runs it, so it still gates the release. The caller re-runs CI when the label
#   is added (`labeled` in examples/ci.yml).
# - The Rust cache is saved only from main; PR runs restore it.
#
# The check recipes live in ci/common.just, fetched from `ci-repo` at `ci-ref`
# (checked out to `.ci`, then moved to `$RUNNER_TEMP/rust-base`).
#
# Per-app settings come from the `ci` section of the caller repo's
# `.github/rust-base.json` (the `config` job). A non-empty input overrides the
# file; a missing file or key means the default.
name: Tauri CI

on:
  workflow_call:
    inputs:
      ci-ref:
        description: Ref of `ci-repo` to fetch `ci/common.just` from.
        type: string
        default: v1
      ci-repo:
        description: Repository holding the shared files (`ci/common.just`, `ci/scripts/`).
        type: string
        default: RobbieMinderhoud/rust-base
      rust-runner:
        description: >-
          Runner for the Rust job. On Linux the Tauri system packages are
          installed first. Empty: `ci.rust-runner` from .github/rust-base.json,
          else `ubuntu-latest`.
        type: string
        default: ""
      windows:
        description: >-
          When to run the Rust checks on windows-latest: `auto` (every event
          except pull requests; pull requests only with the `windows` label),
          `always` or `never`.
        type: string
        default: auto
      windows-test-scope:
        description: >-
          Arguments for `cargo test` on Windows (e.g. `-p my-core`). Empty:
          `ci.windows-test-scope` from .github/rust-base.json, else `--workspace`.
        type: string
        default: ""
      extra-recipe:
        description: >-
          Recipe from the caller's justfile to run after the rust recipe, on the
          rust runner. Empty: `ci.extra-recipe` from .github/rust-base.json, else none.
        type: string
        default: ""

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # Reads the caller repo's .github/rust-base.json (at the caller's ref) once,
  # so the values can set `runs-on` and job conditions. Per key: a non-empty
  # input wins, then the file, then the default. A boolean is true when the
  # input or the file says true. Unknown keys warn; a wrong type fails the run.
  config:
    name: Read .github/rust-base.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust-runner: ${{ steps.resolve.outputs.rust-runner }}
      windows-test-scope: ${{ steps.resolve.outputs.windows-test-scope }}
      extra-recipe: ${{ steps.resolve.outputs.extra-recipe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/rust-base.json
          sparse-checkout-cone-mode: false

      - name: Resolve settings
        id: resolve
        env:
          SECTION: ci
          # key: [type, default]
          SPEC: >-
            {"rust-runner": ["string", "ubuntu-latest"],
            "windows-test-scope": ["string", "--workspace"],
            "extra-recipe": ["string", ""]}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          file=.github/rust-base.json
          cfg='{}'
          if [ -f "$file" ]; then
            if ! cfg=$(jq -c . "$file") || [ "$(jq -r type <<< "$cfg")" != object ]; then
              echo "::error file=$file::$file must hold a single JSON object."
              exit 1
            fi
          else
            echo "No $file in $GITHUB_REPOSITORY; using the defaults."
          fi
          result=$(jq -n -c --argjson cfg "$cfg" --argjson spec "$SPEC" \
            --argjson inputs "$INPUTS" --arg section "$SECTION" '
            (if $cfg | has($section) then $cfg[$section] else {} end) as $s
            | if ($s | type) != "object" then
                {warnings: [], values: {},
                 errors: ["\($section) must be an object, got \($s | type)"]}
              else
                {
                  warnings: [
                    (($cfg | keys) - ["ci", "release", "integration"] | .[]
                      | "unknown section \(.) (ignored)"),
                    (($s | keys) - ($spec | keys) | .[]
                      | "unknown key \($section).\(.) (ignored)")
                  ],
                  errors: [
                    $spec | to_entries[] | .key as $k | .value[0] as $t
                    | select(($s | has($k)) and ($s[$k] | type) != $t)
                    | "\($section).\($k) must be a \($t), got \($s[$k] | type)"
                  ],
                  values: ($spec | with_entries(
                    .key as $k | .value[0] as $t | .value[1] as $default
                    | .value = (
                        if $t == "boolean" then ($inputs[$k] == true or $s[$k] == true)
                        elif ($inputs[$k] // "") != "" then $inputs[$k]
                        elif ($s[$k] // "") != "" then $s[$k]
                        else $default end)))
                }
              end')
          while IFS= read -r msg; do
            echo "::warning file=$file::$msg"
          done < <(jq -r '.warnings[]' <<< "$result")
          errors=$(jq -r '.errors[]' <<< "$result")
          if [ -n "$errors" ]; then
            while IFS= read -r msg; do
              echo "::error file=$file::$msg"
            done <<< "$errors"
            exit 1
          fi
          delim="EOF_$(openssl rand -hex 16)"
          while IFS= read -r key; do
            value=$(jq -r --arg k "$key" '.values[$k]' <<< "$result")
            printf '%s: %s\n' "$key" "$value"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delim" "$value" "$delim" >> "$GITHUB_OUTPUT"
          done < <(jq -r '.values | keys[]' <<< "$result")

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch shared CI files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.ci-repo }}
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false

      - name: Move shared CI files out of the workspace
        run: mv .ci "$RUNNER_TEMP/rust-base"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: just -f "$RUNNER_TEMP/rust-base/ci/common.just" -d . frontend

  rust:
    needs: config
    runs-on: ${{ needs.config.outputs.rust-runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch shared CI files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.ci-repo }}
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false

      - name: Move shared CI files out of the workspace
        run: mv .ci "$RUNNER_TEMP/rust-base"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Tauri's build script links against the system WebKitGTK/GTK libraries;
      # libdbus/pkg-config cover keyring and other D-Bus crates.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Only main saves the cache (PRs restore it), so PR runs don't evict
      # main's entries from the 10 GB repo cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Rust checks
        run: just -f "$RUNNER_TEMP/rust-base/ci/common.just" -d . rust

      - name: Extra recipe
        if: needs.config.outputs.extra-recipe != ''
        env:
          EXTRA_RECIPE: ${{ needs.config.outputs.extra-recipe }}
        run: just "$EXTRA_RECIPE"

  windows:
    needs: config
    if: >-
      inputs.windows == 'always'
      || (inputs.windows == 'auto'
          && (github.event_name != 'pull_request'
              || contains(github.event.pull_request.labels.*.name, 'windows')))
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TEST_SCOPE: ${{ needs.config.outputs.windows-test-scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch shared CI files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.ci-repo }}
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false

      - name: Move shared CI files out of the workspace
        run: mv .ci "$RUNNER_TEMP/rust-base"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Only main saves the cache (PRs restore it), so PR runs don't evict
      # main's entries from the 10 GB repo cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Rust checks
        run: just -f "$RUNNER_TEMP/rust-base/ci/common.just" -d . rust

  ci-ok:
    if: always()
    needs: [config, frontend, rust, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # A skipped windows job (no `windows` label, or `windows: never`) is
      # fine; failure or cancel is not (a failed config job skips rust and
      # windows, and fails here).
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          case "$WINDOWS" in
            auto | always | never) ;;
            *)
              echo "::error::Input windows must be auto, always or never (got '$WINDOWS')."
              exit 1
              ;;
          esac
          echo "needed job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
