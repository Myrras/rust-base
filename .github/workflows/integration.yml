# Nightly + on demand: runs `just test-integration` (the #[ignore]d tests)
# through the LOCAL reusable workflow.
name: Integration tests

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    uses: ./.github/workflows/reusable-integration.yml
    with:
      ci-repo: ${{ github.repository }}
      ci-ref: ${{ github.sha }}
      # Same packages as reusable-tauri-ci.yml: the workspace includes src-tauri.
      apt-packages: >-
        libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
        libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
        libssl-dev libdbus-1-dev pkg-config build-essential file
