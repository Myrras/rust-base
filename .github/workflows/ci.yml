# rust-base's own CI: runs the LOCAL reusable workflow on the template app, so
# every PR self-tests the shared CI. Shared files come from this repo at the
# PR's head commit (ci-repo/ci-ref). Apps use examples/ci.yml instead, which
# pins @v2 and adds the release job. The template app is never released.
#
# Every push to main runs CI, including Windows. Pull requests run frontend and
# Rust only; Windows on a PR comes from ci-windows.yml (the `windows` label).
# No label event starts this workflow: GitHub judges the required `ci / ci-ok`
# by the latest run of this workflow on the head commit, so a label run that
# skipped `ci` would hide it ("Expected — Waiting for status to be reported").
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Only a new commit cancels a run (`synchronize` cancels the run of the
  # previous commit), so a cancelled `ci / ci-ok` always belongs to an
  # outdated commit and never blocks the merge.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/reusable-tauri-ci.yml
    with:
      ci-repo: ${{ github.repository }}
      ci-ref: ${{ github.event.pull_request.head.sha || github.sha }}
