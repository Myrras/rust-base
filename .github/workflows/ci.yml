# rust-base's own CI: runs the LOCAL reusable workflow on the template app, so
# every PR self-tests the shared CI. Shared files come from this repo at the
# PR's head commit (ci-repo/ci-ref). Apps use examples/ci.yml instead, which
# pins @v1 and adds the release job. The template app is never released.
# Every push to main runs CI, including Windows. Pull requests run Windows only
# with the `windows` label; adding the label re-runs CI for the PR. Any other
# label (e.g. release:patch) starts a run whose `ci` job is skipped: it doesn't
# cancel the running CI and adds no `ci / ci-ok` check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  # Labels other than `windows` get their own group, so they never cancel the
  # running CI. Adding `windows` shares the group: it replaces the running CI
  # with one that includes Windows, so only one `ci / ci-ok` is in flight.
  group: ci-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'windows' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    # Keep this condition: it is what stops an unrelated label from producing
    # a skipped (= passing) `ci / ci-ok` check.
    if: github.event.action != 'labeled' || github.event.label.name == 'windows'
    uses: ./.github/workflows/reusable-tauri-ci.yml
    with:
      ci-repo: ${{ github.repository }}
      ci-ref: ${{ github.event.pull_request.head.sha || github.sha }}
