# Release on every push to main (a merged PR). Turns CHANGELOG.md's
# `## [Unreleased]` section into the next version, bumps the manifests, commits
# `Release vX.Y.Z [skip ci]` to main, tags it, creates the GitHub Release and
# dispatches the caller's build.yml, which attaches the installers.
# pr-checks.yml makes every PR add that entry and carry exactly one release
# label (release:patch, release:minor or release:major).
#
# One release can cover several merged PRs: GitHub cancels a pending run on
# main when a newer one queues, even with cancel-in-progress: false. The bump is
# therefore the highest label over every PR merged since the previous release.
#
# Caller job (needs its CI job, runs only on push to main):
#   permissions: { contents: write, pull-requests: read, actions: write }
#   secrets: { RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }} }
name: release

on:
  workflow_call:
    inputs:
      ci-ref:
        description: Ref of RobbieMinderhoud/ci-workflows to fetch the shared scripts from.
        type: string
        default: v1
      title-prefix:
        description: >-
          Prefix for the GitHub Release title and the tag message, joined with a
          space (`MyApp` → `MyApp v1.2.3`). Empty: title `v1.2.3`, tag message
          `Release v1.2.3`.
        type: string
        default: ""
      require-deploy-key:
        description: Fail instead of warn when RELEASE_DEPLOY_KEY is not set (main is protected).
        type: boolean
        default: false
    secrets:
      RELEASE_DEPLOY_KEY:
        description: >-
          Private half of a write-enabled deploy key. Pushing over SSH with it
          lets the release commit through a protected main via the ruleset's
          DeployKey bypass.
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Never run two releases at once; a queued run must see the previous run's
    # release commit. Groups are per repository, so callers don't collide. A
    # pending run that a newer one replaces is cancelled; the newer run then
    # releases its changes too.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A repo with an unprotected main can release with GITHUB_TOKEN, so a
      # missing key only warns unless the caller sets require-deploy-key. On a
      # protected main a GITHUB_TOKEN push is rejected with an opaque GH013, and
      # this message names the fix.
      - name: Deploy key configured?
        env:
          HAS_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
          REQUIRE_KEY: ${{ inputs.require-deploy-key }}
        run: |
          fix="ssh-keygen -t ed25519 -N '' -C release -f release_key; gh repo deploy-key add release_key.pub --allow-write --title 'CI release'; gh secret set RELEASE_DEPLOY_KEY < release_key; delete both key files; add DeployKey as a bypass actor on main's ruleset; pass RELEASE_DEPLOY_KEY to release.yml under the caller job's secrets (no secrets: inherit)."
          if [ "$HAS_KEY" != "true" ]; then
            if [ "$REQUIRE_KEY" = "true" ]; then
              echo "::error title=RELEASE_DEPLOY_KEY missing::The release push needs a deploy key. $fix"
              exit 1
            fi
            echo "::warning title=RELEASE_DEPLOY_KEY not set::Pushing the release with GITHUB_TOKEN. That only works while main is unprotected. For a protected main: $fix"
          fi

      # The caller repo, at main rather than the pushed sha: a queued second run
      # must see the first run's release commit, or it would release the same
      # version twice. With the deploy key, checkout configures SSH so the push
      # below uses it; unset, the secret is an empty string and checkout falls
      # back to GITHUB_TOKEN over HTTPS.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # Shared scripts, moved out of the caller checkout so they can never
      # land in the release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RobbieMinderhoud/ci-workflows
          ref: ${{ inputs.ci-ref }}
          path: .ci
          persist-credentials: false
      - run: mv .ci "$RUNNER_TEMP/ci"

      # changelog.sh exits 1 for an empty Unreleased section: an earlier run
      # already released this, so the run stays green. Any other failure (no
      # CHANGELOG.md, no `## [Unreleased]` heading: exit 2) fails the run.
      - name: Anything to release?
        id: pending
        run: |
          status=0
          bash "$RUNNER_TEMP/ci/scripts/changelog.sh" unreleased > "$RUNNER_TEMP/notes.md" || status=$?
          case $status in
            0) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "::notice::Nothing under ## [Unreleased] in CHANGELOG.md; already released." ;;
            *) echo "::error file=CHANGELOG.md::changelog.sh failed (exit $status); see the message above."
               exit "$status" ;;
          esac

      # The latest final release tag reachable from main. Prerelease tags
      # (v1.2.0-rc.1) don't count. Empty for a fresh app.
      - name: Previous release
        id: prev
        if: steps.pending.outputs.release == 'true'
        run: |
          prev=$(git tag --merged HEAD --list 'v*' --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found++')
          echo "previous release: ${prev:-none}"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      # Label aggregation. One release can cover several merged PRs (see
      # the header), so the bump is the highest of release:major > release:minor > release:patch over
      # the labels of every PR merged since PREV: one lookup per first-parent
      # commit on main, skipping earlier `Release v*` commits. No PREV: all
      # first-parent commits. A commit without a PR (direct push) adds no label.
      # Kept self-contained (reads only PREV, GITHUB_REPOSITORY, git, gh) so a
      # local harness can run it against a fake repo with a stubbed gh. Skipped
      # for a first release, whose version comes from Cargo.toml.
      - name: Release bump from merged PRs
        id: bump
        if: steps.pending.outputs.release == 'true' && steps.prev.outputs.tag != ''
        env:
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          if [ -n "$PREV" ]; then range="$PREV..HEAD"; else range=HEAD; fi
          shas=$(git rev-list --first-parent "$range")
          labels=""
          for sha in $shas; do
            subject=$(git log -1 --format=%s "$sha")
            case $subject in
              "Release v"*) echo "$sha: skipped ($subject)"; continue ;;
            esac
            pr_labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '[.[0].labels[]?.name] | join(",")')
            echo "$sha: ${pr_labels:-no PR labels} ($subject)"
            labels="$labels,$pr_labels"
          done
          case "$labels," in
            *,release:major,*) bump="major" ;;
            *,release:minor,*) bump="minor" ;;
            *) bump="patch" ;;
          esac
          echo "bump: $bump"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      # No release tag yet (a fresh app): the first release ships the version
      # that is already in Cargo.toml instead of bumping it.
      - name: Determine version
        if: steps.pending.outputs.release == 'true'
        env:
          PREV: ${{ steps.prev.outputs.tag }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          if [ -n "$PREV" ]; then
            tag=$(bash "$RUNNER_TEMP/ci/scripts/next-version.sh" "$PREV" "release:$BUMP")
            echo "$PREV → $tag ($BUMP)"
          else
            tag="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            echo "no release tag yet → first release $tag"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Bump CHANGELOG, manifests and Cargo.lock
        if: steps.pending.outputs.release == 'true'
        run: |
          bash "$RUNNER_TEMP/ci/scripts/changelog.sh" release "$VERSION" "$(date -u +%F)"
          bash "$RUNNER_TEMP/ci/scripts/sync-version.sh" --set "$VERSION"
          cargo update --workspace
          bash "$RUNNER_TEMP/ci/scripts/sync-version.sh" --check
          git diff --stat

      - name: Release title
        if: steps.pending.outputs.release == 'true'
        env:
          TITLE_PREFIX: ${{ inputs.title-prefix }}
        run: |
          if [ -n "$TITLE_PREFIX" ]; then
            title="$TITLE_PREFIX $TAG"
            tag_message="$title"
          else
            title="$TAG"
            tag_message="Release $TAG"
          fi
          echo "TITLE=$title" >> "$GITHUB_ENV"
          echo "TAG_MESSAGE=$tag_message" >> "$GITHUB_ENV"

      # `[skip ci]`: a push made with the deploy key (unlike one with
      # GITHUB_TOKEN) triggers workflows, and CI on the release commit or a
      # build on its tag would only repeat work. build.yml is dispatched below.
      # If main moved since checkout (another PR merged), the atomic push is
      # rejected as non-fast-forward / fetch first and nothing is pushed. That
      # merge's own run releases both, so this run ends green without a
      # release. Any other push error fails.
      - name: Commit, tag and push
        id: push
        if: steps.pending.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG [skip ci]"
          git tag -a "$TAG" -m "$TAG_MESSAGE"
          status=0
          out=$(git push --atomic origin HEAD:main "$TAG" 2>&1) || status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            if grep -qE '\[rejected\] +HEAD -> main \((non-fast-forward|fetch first)\)' <<< "$out"; then
              echo "::notice::main moved; the newer run will release"
              exit 0
            fi
            exit "$status"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.push.outputs.pushed == 'true'
        run: gh release create "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      # The one and only installer build for a release: the caller's build.yml
      # has no tag trigger, so it never depends on whether [skip ci] also
      # suppresses the tag push. build.yml attaches the installers to the
      # release. GITHUB_REPOSITORY is the caller repo, so this dispatches its
      # build.yml, not this repo's.
      - name: Build installers
        if: steps.push.outputs.pushed == 'true'
        run: gh workflow run build.yml --ref "$TAG"
