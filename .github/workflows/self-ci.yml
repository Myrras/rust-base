name: self-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
          ./actionlint -color examples/*.yml sync/files/.github/workflows/*.yml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: prettier
        run: npx --yes prettier@3.9.4 --check .

      - name: shellcheck
        run: shellcheck ci/scripts/*.sh

      - name: Script tests
        run: |
          shopt -s nullglob
          for t in ci/scripts/*.test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: just format and list
        run: |
          just --fmt --check --unstable -f ci/common.just
          just --fmt --check --unstable
          just -f ci/common.just --list
          just --list
